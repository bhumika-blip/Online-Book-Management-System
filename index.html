<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Book Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      
      <h1>Online Book Management System</h1>
      <p class="subtitle">Add, view, update and delete books in one place.</p>
    </header>

    <section class="panel">
      <h2 id="formHeading">Add a Book</h2>
      <form id="bookForm">
        <div class="form-grid">
          <label>
            Book Title
            <input id="title" type="text" placeholder="Enter book title" required>
          </label>
          <label>
            Author
            <input id="author" type="text" placeholder="Enter author name" required>
          </label>
          <label>
            Price (₹)
            <input id="price" type="number" min="0" step="0.01" placeholder="Enter price" required>
          </label>
        </div>
        <div class="form-actions">
          <button id="submitButton" type="submit">Add Book</button>
          <button id="cancelButton" class="secondary hidden" type="button">Cancel Edit</button>
        </div>
      </form>
      <p id="message" class="message" role="status"></p>
    </section>

    <section class="panel">
      <div class="list-heading">
        <div>
          <h2>Available Books</h2>
          <p class="muted">Book details are displayed below.</p>
        </div>
        <button id="refreshButton" class="secondary" type="button">Refresh List</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Author</th>
              <th>Price</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="booksTable">
            <tr><td colspan="5" class="empty">Loading books...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    <footer>Online Book Management System · Practical application</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
